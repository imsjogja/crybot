# Deployment produksi — lihat blueprint Bagian 8.
# Prasyarat host: IP statis (untuk IP whitelist API key), jam tersinkron NTP/chrony,
# region AWS Tokyo (Binance) untuk latensi terendah.

services:
  crybot:
    build: .
    image: crybot:latest
    container_name: crybot
    # Exit bersih dari aksi Stop tidak dihidupkan kembali; crash masih dicoba ulang.
    restart: on-failure:5
    command: ["crypto-copy-bot", "${CRYBOT_CONFIG_PATH:-config/config.yaml}"]
    env_file: .env            # API keys & Telegram — JANGAN commit file ini
    volumes:
      - ./data:/app/data      # event log SQLite persisten
      - ./config:/app/config:ro
    # Dashboard hanya dapat dijangkau reverse proxy host, bukan Internet langsung.
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
