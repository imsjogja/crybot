# Konfigurasi crypto-copy-bot — parameter non-rahasia saja.
# Rahasia (API key) HANYA lewat .env — lihat .env.example.

# paper   : simulasi fill di harga pasar (default aman, tanpa order riil)
# testnet : order riil ke testnet Binance
# live    : order riil ke mainnet (WAJIB armed=true secara sadar)
mode: paper

# Pasar akun follower: spot (default) | futures
# Futures mengaktifkan: posisi short, leverage, guard SL otomatis, flatten.
market: futures

master:
  # Nama env var berisi API key READ-ONLY akun master (bukan key-nya langsung!)
  api_key_env: MASTER_API_KEY
  api_secret_env: MASTER_API_SECRET
  # Dipakai bila query equity master gagal
  fallback_equity_usdt: "10000"

follower:
  api_key_env: FOLLOWER_API_KEY
  api_secret_env: FOLLOWER_API_SECRET
  fallback_equity_usdt: "1000"

copy:
  # equity_proportional | fixed_amount | fixed_ratio
  sizing: equity_proportional
  fixed_amount_usdt: "50"
  fixed_ratio: "0.1"
  # Hard cap per trade — typo config tidak boleh membuat order raksasa
  max_per_trade_usdt: "200"
  # Di bawah minimum notional Binance (5 USDT) -> SKIP, jangan dibulatkan naik
  min_notional_usdt: "5.1"
  # Slippage guard: deviasi harga vs fill master di atas ini -> SKIP
  slippage_guard_pct: "0.4"
  # Hanya pair ini yang disalin (format Binance, tanpa slash)
  symbol_allowlist:
    - BTCUSDT
    - ETHUSDT
  max_open_positions: 3
  # Master > N trade/menit -> pause copying (deteksi perilaku anomali)
  burst_max_trades_per_min: 20

risk:
  daily_loss_limit_pct: "3"
  kill_switch_drawdown_pct: "10"
  # false = tidak ada order sama sekali. Set true HANYA setelah paper/testnet lolos.
  armed: false

monitor:
  telegram_bot_token_env: TELEGRAM_BOT_TOKEN
  telegram_chat_id_env: TELEGRAM_CHAT_ID
  alert_on_fill: true
  # Perintah interaktif /status /stop /resume (hanya dari TELEGRAM_CHAT_ID)
  commands_enabled: true

store:
  sqlite_path: data/events.db

# Guard futures (adopsi invarian flavebot: posisi tak pernah tanpa SL)
guard:
  # Pasang STOP_MARKET otomatis setiap posisi terbuka (wajib true di futures)
  sl_enabled: true
  # Jarak SL default dari harga entry (%) — bisa dioverride dinamis dari UI
  default_sl_pct: "2"
  # Bila gagal memasang SL -> posisi langsung ditutup market (fail-safe)
  close_if_sl_fails: true
  # /stop juga menutup semua posisi terbuka (flatten). Default false = stop entry saja.
  flatten_on_stop: false
  # Cap total exposure (notional USDT) semua posisi -> alert. 0 = nonaktif.
  max_exposure_usdt: "0"
  # Leverage futures per symbol (diset saat startup). UI bisa override (aktif setelah restart).
  leverage: 3

# Screener master publik (leaderboard Binance) — skor kredibilitas 0–100
screener:
  enabled: true
  # Interval polling leaderboard (menit)
  interval_min: 240
  # Skor minimum kandidat yang diangkat sebagai "layak"
  min_score: 60
  # Mode B (EKSERIMENTAL): replikasi posisi kandidat publik teratas.
  # Default false — gunakan Mode A (copy native Binance + crybot sebagai pengaman).
  replicate_public: false

# Dashboard web — UI visual untuk pengguna awam
web:
  enabled: true
  # WAJIB 127.0.0.1 kecuali di belakang reverse proxy TLS.
  # Akses dari laptop: ssh -L 8080:127.0.0.1:8080 user@vps
  bind: "127.0.0.1:8080"

reconcile:
  # Rekonsiliasi posisi lokal vs exchange tiap N menit (0 = nonaktif).
  # Otomatis nonaktif di mode paper.
  interval_min: 60
  # Drift di atas ini (%) -> alert kritis
  tolerance_pct: "1"
