# Konfigurasi crybot — Base Network trading bot.
# Parameter non-rahasia saja; rahasia (private key) HANYA lewat .env.

# paper   : simulasi, tidak ada tx broadcast (aman default)
# testnet : tx riil ke Base testnet/sepolia
# live    : tx riil ke Base mainnet (WAJIB armed=true secara sadar)
mode: paper

risk:
  daily_loss_limit_pct: "3"
  kill_switch_drawdown_pct: "10"
  # false = bot tidak mengirim order apa pun. Set true HANYA setelah paper/testnet lolos.
  armed: false
  # Nilai maksimum per transaksi dalam ETH (blueprint §9: max transaction value).
  max_tx_value_eth: "0.05"
  # Allowlist router DEX yang boleh dieksekusi (kosong = default 6 router dari base.addresses).
  allowed_routers: []
  # Saat emergency halt: SELL tetap diizinkan (controlled exit), BUY diblokir (§13).
  allow_sell_during_halt: true
  # Circuit breaker: N error eksekusi beruntun -> emergency stop otomatis (§13).
  circuit_breaker_consecutive_errors: 5
  # Price impact maksimum (persen) yang masih boleh dieksekusi (blueprint §7).
  max_price_impact_pct: "10"

# Simulation gate (blueprint §8): eth_call + estimate_gas SEBELUM submit,
# berlaku di mode paper maupun live.
simulation:
  pre_submit: true
  # Quote lebih tua dari ini (ms) dianggap stale dan ditolak risk engine (§3.5).
  quote_ttl_ms: 3000
  # Wajibkan simulasi SELL balik untuk order BUY (§8 sellability check).
  # Aktifkan hanya setelah strategi menghasilkan reverse_calldata yang valid.
  require_sell_sim: false

monitor:
  telegram_bot_token_env: TELEGRAM_BOT_TOKEN
  telegram_chat_id_env: TELEGRAM_CHAT_ID
  alert_on_fill: true
  # Perintah interaktif /status /halt /resume /stop (hanya dari TELEGRAM_CHAT_ID)
  commands_enabled: true

store:
  sqlite_path: data/events.db

# Dashboard web — UI visual untuk pengguna awam
web:
  enabled: true
  # WAJIB 0.0.0.0 di dalam container; akses lokal pakai SSH tunnel.
  bind: "0.0.0.0:8080"

# Base Network connection
base:
  ws_url: "wss://base-flashblocks.coinbase.com/v1/ws/base"
  http_url: "https://mainnet.base.org"
  flashblocks: true
  mev_rpc_url: null
  # Interval polling fallback HTTP bila WSS down (ms).
  poll_interval_ms: 1000
  # Market state lebih tua dari ini (ms) dianggap stale (blueprint §4).
  stale_ms: 10000
  private_key_env: BASE_PRIVATE_KEY

# Strategi Base Network — semua default disabled (aman)
strategies:
  sniper:
    enabled: false
    max_buy_eth: "0.05"
    min_liquidity_eth: "1.0"
    auto_tp_pct: "50"
    auto_sl_pct: "20"
    safety:
      check_honeypot: true
      check_ownership_renounced: true
      check_lp_locked: false
      check_holder_distribution: true
      max_holder_pct: "5"

  copy_onchain:
    enabled: false
    slippage_bps: 300
    sizing: fixed_ratio
    copy_ratio: "0.1"
    min_tx_eth: "0.01"
    max_tx_eth: "1.0"
    target_wallets: []

  grid_dca:
    enabled: false
    grids: []
    dca_plans: []

  arbitrage:
    enabled: false
    min_profit_eth: "0.001"
    max_gas_gwei: 5
    monitored_pools: []

  yield_farming:
    enabled: false
    auto_compound_interval_hours: 6
    min_fee_threshold_eth: "0.001"
    positions: []

  perps:
    enabled: false
    max_leverage: 10
    exchange_router: null
    reader: null
    positions: []
