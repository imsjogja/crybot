[package]
name = "crypto-copy-bot"
version = "0.1.0"
edition = "2021"
description = "Low-latency crypto copy-trading bot (Binance WS API, event-driven, Rust/tokio)"

[dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rust_decimal = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
axum = "0.8"
subtle = "2.6"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
